# Agent containers sit on an internal Docker network with no route out. This proxy is their only
# exit, and it only forwards HTTPS CONNECT requests whose host matches /etc/tinyproxy/filter.
Port 8888
Listen 0.0.0.0
Timeout 3600
MaxClients 256
LogLevel Connect
DisableViaHeader Yes
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes
